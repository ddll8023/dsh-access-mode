# dsh-access-mode bundle patch.
#
# Reconfigure the native Permission Presets service with this package's three
# mode bundles. The current Web composer consumes its `permissions` projection
# directly, so the native service remains mounted; only its separate settings
# UI is disabled. The host row adds the extra Default-mode access gate.

- id: permission
  config:
    presets:
      default:
        sandbox: workspace-write
        approval: ask
        name: Default
        description: Read-only tools and conservative read-only Bash run automatically; mutations require approval.
      no-edit:
        sandbox: danger-full-access
        approval: ask
        name: No Edit
        description: Only edit and write require approval; approved operations use full file access.
      auto:
        sandbox: danger-full-access
        approval: never
        name: Auto
        description: All tool calls run without approval prompts.
    defaultPreset: no-edit

- id: ui-permission
  disabled: true

- insert:
    - id: access-mode
      name: 'dsh-access-mode'
